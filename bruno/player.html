<!DOCTYPE html>
<html>
<head>
  <title>MediaForge Player</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; padding: 20px; }
    video { width: 100%; max-width: 900px; display: block; margin: 20px auto; }
    input { width: 600px; padding: 8px; font-size: 14px; }
    button { padding: 8px 16px; margin-left: 8px; }
    #info { margin: 10px auto; max-width: 900px; font-size: 13px; color: #aaa; }
  </style>
</head>
<body>
  <h2 style="text-align:center">MediaForge HLS Player</h2>
  <div style="text-align:center; margin-bottom:20px">
    <input id="assetId" placeholder="Enter Asset ID (GUID)" />
    <button onclick="load()">Load</button>
  </div>
  <video id="video" controls></video>
  <audio id="audio" controls style="display:none; width:100%; max-width:900px; margin:20px auto"></audio>
  <canvas id="waveform" width="900" height="80"
    style="display:none; max-width:900px; margin:10px auto; background:#222; display:block"></canvas>
  <div id="info"></div>
  <div id="chapters"></div>
  <script>
    async function load() {
      const assetId = document.getElementById('assetId').value.trim();
      const res = await fetch(`http://localhost:5000/api/media/${assetId}/stream`);
      if (!res.ok) { alert('Asset not found or not ready'); return; }
      const data = await res.json();

      document.getElementById('info').innerHTML =
        `Duration: ${data.durationSeconds}s | ` +
        `Variants: ${data.variants.map(v => v.height + 'p').join(', ')} | ` +
        `Waveform: ${data.waveformUrl ? 'yes' : 'no'} | ` +
        `Subtitles: ${data.subtitleUrl ? 'yes' : 'no'}`;

      const isAudio = data.variants.length === 0;
      const video = document.getElementById('video');
      const audio = document.getElementById('audio');
      let player;

      if (isAudio) {
        video.style.display = 'none';
        audio.style.display = 'block';
        player = audio;

        audio.src = data.outputUrls[0];

        if (data.subtitleUrl) {
          const track = document.createElement('track');
          track.kind = 'subtitles';
          track.label = 'English';
          track.srclang = 'en';
          track.src = data.subtitleUrl;
          track.default = true;
          audio.appendChild(track);
        }

        audio.play();
      } else {
        video.style.display = 'block';
        audio.style.display = 'none';
        player = video;

        // Pick highest quality
        const best = data.variants.sort((a,b) => b.height - a.height)[0];

        if (Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(best.playlistUrl);
          hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = best.playlistUrl;
        }

        if (data.subtitleUrl) {
          const track = document.createElement('track');
          track.kind = 'subtitles';
          track.label = 'English';
          track.srclang = 'en';
          track.src = data.subtitleUrl;
          track.default = true;
          video.appendChild(track);
        }

        video.play();
      }

      if (data.waveformUrl) {
        fetch(data.waveformUrl)
          .then(r => r.json())
          .then(w => drawWaveform(w.peaks));
      }

      if (data.chapters && data.chapters.length > 0) {
        renderChapters(data.chapters, player);
      } else {
        document.getElementById('chapters').innerHTML = '';
      }
    }

    function drawWaveform(peaks) {
      const canvas = document.getElementById('waveform');
      canvas.style.display = 'block';
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = '#4af';
      const barWidth = w / peaks.length;
      peaks.forEach((peak, i) => {
        const barH = peak * h;
        ctx.fillRect(i * barWidth, (h - barH) / 2, barWidth - 1, barH);
      });
    }

    function renderChapters(chapters, player) {
      const div = document.getElementById('chapters');
      div.innerHTML = '<h3 style="color:#fff">Chapters</h3>';
      chapters.forEach(ch => {
        const btn = document.createElement('button');
        btn.textContent = `${formatTime(ch.startTimeSeconds)} - ${ch.title}`;
        btn.style.cssText = 'display:block;margin:4px 0;padding:6px 12px;background:#333;color:#fff;border:none;cursor:pointer;border-radius:4px;width:300px;text-align:left';
        btn.onclick = () => { player.currentTime = ch.startTimeSeconds; player.play(); };
        div.appendChild(btn);
      });
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s.toString().padStart(2, '0')}`;
    }
  </script>
</body>
</html>
